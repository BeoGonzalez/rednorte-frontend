<div class="chat-wrapper">
  <div class="chat-header">
    <div class="bot-avatar">
      <i class="ai-icon">🤖</i>
    </div>
    <div class="header-info">
      <h2>Asistente de Triaje IA</h2>
      <span class="status">En línea</span>
    </div>
  </div>

  <div class="chat-messages" #chatContainer>
    <div *ngFor="let msg of messages" 
         class="message-bubble" 
         [ngClass]="{'user-msg': msg.sender === 'user', 'bot-msg': msg.sender === 'bot'}">
      
      <div class="msg-content">
        <p>{{ msg.text }}</p>
        <span class="time">{{ msg.timestamp | date:'HH:mm' }}</span>
      </div>
    </div>

    <div *ngIf="isTyping" class="message-bubble bot-msg typing-indicator">
      <div class="msg-content">
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea 
      [(ngModel)]="userInput" 
      (keydown)="handleKeyPress($event)"
      placeholder="Describe tus síntomas aquí..." 
      rows="1">
    </textarea>
    <button (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping" class="send-btn">
      Enviar <span>➤</span>
    </button>
  </div>
</div>
