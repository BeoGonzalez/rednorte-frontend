<div class="appointment-row">
  <div class="appointment-row__time-block">
    <div class="time-badge">
      <span class="time-badge__label">{{ appointment().label }}</span>
      <span class="time-badge__value">{{ appointment().time }}</span>
    </div>
  </div>

  <div class="appointment-row__info">
    <h3 class="appointment-row__name">{{ appointment().patientName }}</h3>
    <div class="appointment-row__tags">
      <app-tag variant="primary">{{ appointment().appointmentType }}</app-tag>
      <app-tag variant="neutral">{{ appointment().status }}</app-tag>
    </div>
  </div>

  <div class="appointment-row__action">
    <app-button variant="outline" (onClick)="callToBox()">
      <span class="material-symbols-outlined">campaign</span>
      Llamar a Box
    </app-button>
  </div>
</div>
