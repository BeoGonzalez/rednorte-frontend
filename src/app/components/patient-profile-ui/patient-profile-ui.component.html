<div class="patients-table-container">
  
  <div *ngIf="isLoading" class="loading-spinner">
    Cargando pacientes...
  </div>

  <div *ngIf="errorMessage" class="error-alert">
    {{ errorMessage }}
  </div>

  <table class="table" *ngIf="!isLoading && !errorMessage && pacientes?.length">
    <thead>
      <tr>
        <th>RUT</th>
        <th>Nombre Completo</th>
        <th>Email</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pacientes">
        <td>{{ p.rut }}</td>
        <td>{{ p.nombre }} {{ p.apellido }}</td>
        <td>{{ p.email }}</td>
        <td>
          <span [class.active]="p.estado === 'ACTIVO'" [class.inactive]="p.estado !== 'ACTIVO'">
            {{ p.estado }}
          </span>
        </td>
        <td>
          <button (click)="onVerDetalle(p.rut)">Ver Ficha</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!isLoading && !errorMessage && pacientes?.length === 0">
    No hay pacientes registrados en el sistema.
  </div>
</div>
